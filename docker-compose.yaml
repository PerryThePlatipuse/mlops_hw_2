services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - ml-scorer
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    networks:
      - ml-scorer
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ml-scorer
    restart: on-failure
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1 --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic scores --partitions 3 --replication-factor 1 --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions_clickhouse --partitions 1 --replication-factor 1

  fraud_detector:
    profiles: [fraud]
    build: ./fraud_detector
    image: fraud-detector:local
    networks:
      - ml-scorer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TRANSACTIONS_TOPIC: "transactions"
      KAFKA_SCORING_TOPIC: "scores"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  postgres:
    profiles: [fraud]
    image: postgres:16-alpine
    networks:
      - ml-scorer
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U fraud -d fraud"]
      interval: 5s
      retries: 10

  result_writer:
    profiles: [fraud]
    image: fraud-detector:local
    command: ["python", "./app/result_writer.py"]
    networks:
      - ml-scorer
    environment:
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      postgres:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  interface:
    profiles: [fraud]
    build: ./interface
    networks:
      - ml-scorer
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "transactions"
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    networks:
      - ml-scorer
    environment:
      CLICKHOUSE_USER: homework
      CLICKHOUSE_PASSWORD: boba_aboba
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "homework", "--password", "boba_aboba", "--query", "SELECT 1"]
      interval: 5s
      retries: 20

  clickhouse-init:
    image: clickhouse/clickhouse-server:25.8-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "clickhouse-client --host clickhouse --user homework --password boba_aboba --multiquery < /schema.sql"
    volumes:
      - ./analytics/schema.sql:/schema.sql:ro
    networks:
      - ml-scorer
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  csv_loader:
    profiles: [loader]
    build: ./analytics
    volumes:
      - ./data:/data:ro
    networks:
      - ml-scorer
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully

networks:
  ml-scorer:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
